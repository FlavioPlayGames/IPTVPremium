def kit = gradle.startParameter.initScripts.find { it.name == 'validar-icones.gradle' }.parentFile
gradle.beforeProject { p ->
    p.plugins.withId('com.android.application') {
        p.android.testOptions.unitTests.includeAndroidResources = true
        p.android.sourceSets.getByName('test').kotlin.srcDir(new File(kit, 'kotlin'))
        p.dependencies.add('testImplementation', 'junit:junit:4.13.2')
        p.dependencies.add('testImplementation', 'androidx.paging:paging-testing:3.5.2')
        p.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.16.1')
        p.dependencies.add('testImplementation', p.dependencies.platform('androidx.compose:compose-bom:2026.02.01'))
        p.dependencies.add('testImplementation', 'androidx.compose.ui:ui-test-junit4')
        p.dependencies.add('testImplementation', 'androidx.test:core:1.7.0')
        p.tasks.withType(Test).configureEach {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            maxHeapSize = '3g'
        }
    }
}
