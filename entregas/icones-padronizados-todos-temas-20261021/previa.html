<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ícones IPTV Premium — todos os temas</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#eee;font:16px system-ui}header{padding:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:20px;margin:0}select{padding:8px;background:#16191e;color:white;border:1px solid #555;border-radius:6px}.stage{--accent:#ae8b43;max-width:1500px;margin:24px auto;background:linear-gradient(180deg,#090a0c,#030405);padding:0 20px 36px;border-top:1px solid var(--accent)}.icons{width:100%;height:auto;display:block}.names{display:grid;grid-template-columns:repeat(5,1fr);gap:0}.names button{position:relative;text-align:center;border:0;background:none;color:#eee;font:inherit;letter-spacing:.16em;padding:18px 0 0;cursor:pointer}.names button[aria-pressed=true]:before{content:"";position:absolute;top:0;left:35%;width:30%;height:3px;background:var(--accent);border-radius:3px}.names button:focus-visible{outline:1px dashed var(--accent);outline-offset:4px}footer{max-width:1000px;margin:24px auto;padding:16px;color:#aaa;font-size:14px;line-height:1.6}@media(max-width:600px){.names button{font-size:10px;letter-spacing:.08em}.stage{padding:0 8px 20px}}</style><header><h1>Ícones padronizados</h1><label>Tema <select id="theme"><option value="gold">Dourado</option><option value="blue">Azul</option><option value="purple">Roxo</option><option value="red">Vermelho</option><option value="pink">Rosa suave</option><option value="emerald">Verde-esmeralda</option><option value="cyan">Ciano / Turquesa</option></select></label></header><main class="stage" id="stage"><img class="icons" id="icons" src="icones-gold.png" alt="Canais, Filmes, Séries, Kids e Listas"><div class="names"><button type="button" aria-pressed="false">CANAIS</button><button type="button" aria-pressed="false">FILMES</button><button type="button" aria-pressed="true">SÉRIES</button><button type="button" aria-pressed="false">KIDS</button><button type="button" aria-pressed="false">LISTAS</button></div></main><footer>Prévia das artes. Clique em um nome para conferir a barra de seleção. Ainda não aplicado ao aplicativo.</footer><script>const colors={"gold": "#ae8b43", "blue": "#365ba5", "purple": "#9255b4", "red": "#a52d35", "pink": "#b87889", "emerald": "#258363", "cyan": "#29999f"};document.querySelector('#theme').addEventListener('change',e=>{document.querySelector('#icons').src='icones-'+e.target.value+'.png';document.querySelector('#stage').style.setProperty('--accent',colors[e.target.value])});document.querySelectorAll('.names button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.names button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));</script></html>
